# Pilot (HAL-3048): multihop_rag, 50 questions, every applicable system, on the rig.
# Corpus-level questions only: full_context, pageindex, memwalker, readagent and
# raptor read one document at a time and would answer n/a to every question,
# after building indexes over 609 articles for nothing.
dataset: multihop_rag
systems:
  - vectorless
  - vector_rag
  - vector_bge
  - bm25
  - agentic_grep
k: 5
repeats: 1
cold: true
limit: 50
sample_seed: 0
out_dir: runs/pilot
model: gemini-3.5-flash-lite
embedding_model: gemini-embedding-2
gen_model: gemini-3.5-flash-lite
judge: true
judge_model: jev-latest
max_spend_usd: 40              # stop a dataset once its recorded spend reaches this
rig:
  probes:
    engine: http://10.128.0.3:9101
system_params:
  vectorless:
    server_cache_disabled: true
    reuse_documents: true
    ingest_concurrency: 8
  vector_rag:
    backend: pgvector
  vector_bge:
    backend: pgvector
