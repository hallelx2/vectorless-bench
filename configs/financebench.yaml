# FinanceBench config: the real head-to-head.
#
# Prereqs:
#   1. A Vectorless server reachable via the SDK, ideally with caches DISABLED
#      (retrieval.cache.enabled=false + llmgate cache off) for fair cold-cache
#      cost/latency. Set VECTORLESS_API_KEY / VECTORLESS_BASE_URL.
#   2. OPENAI_API_KEY for the vector_rag embeddings and full_context model.
#   3. Postgres + pgvector reachable via VLBENCH_PG_DSN (or set vector_rag
#      backend: memory to skip Postgres).
#   4. The FinanceBench documents fetched + extracted:
#        python scripts/download_financebench.py
#   5. (optional) PageIndex configured — set PAGEINDEX_API_KEY, or switch the
#      pageindex system to mode: tree+nav.
#
# Then:
#   vlbench run --config configs/financebench.yaml
dataset: financebench
dataset_params:
  docs_dir: data/financebench/docs

systems:
  - vectorless
  - vector_rag
  - bm25
  - full_context
  - pageindex

k: 5
repeats: 3            # determinism across reruns
cold: true
limit: 150           # full open subset; lower while iterating
sample_seed: 0
out_dir: runs

# models (priced from the shared table -> apples-to-apples cost)
model: claude-haiku-4-5            # vectorless retrieval + full_context + pageindex nav
embedding_model: text-embedding-3-small
judge: false                       # set true to add the answer-quality axis
judge_model: gpt-4o
gen_model: gpt-4o-mini

system_params:
  vectorless:
    server_cache_disabled: true    # you attest the server runs cold
  vector_rag:
    backend: pgvector              # or "memory" to avoid Postgres
    chunk_tokens: 512
    overlap_tokens: 64
  full_context:
    model: gpt-4o-mini             # cheaper ceiling; bump for max quality
    max_context_tokens: 120000
  pageindex:
    mode: oss                      # "oss" = their tree builder self-hosted; "cloud" = PageIndexClient
    model: gpt-4o-mini             # tree-build model; reasoning uses top-level `model`
    repo_path: /opt/PageIndex      # checkout of VectifyAI/PageIndex (Docker sets this)
