# Full FinanceBench three-way: the Vectorless engine (PageIndex mode, the
# path improved by the citation reframe + GLM-4.6 pricing) vs a real vector
# RAG baseline vs the BM25 lexical floor.
#
# Prereqs (see deploy/README.md):
#   1. The Cloud Run engine redeployed from the fixed code (llmgate v0.3.0 so
#      $/query != 0; reframed pageindex prompt), caches OFF for cold cost.
#   2. .env with VECTORLESS_BASE_URL / VECTORLESS_API_KEY (load_secrets.py),
#      OPENAI_API_KEY (vector_rag embeddings + gen), and VLBENCH_PG_DSN
#      (the bundled pgvector Postgres provides this on the VM).
#   3. FinanceBench docs fetched (run_on_gce.sh does this on the VM).
dataset: financebench
dataset_params:
  docs_dir: data/financebench/docs

systems:
  - vectorless_pageindex
  - vector_rag
  - bm25

k: 5
repeats: 1            # quality/cost/latency from one cold pass; bump for determinism
cold: true
limit: 150           # full open subset
sample_seed: 0
out_dir: runs

# Query-time model recorded in the manifest. The engine answers on glm-4.6
# (the deployed service is configured for z.ai's Anthropic-compatible GLM
# endpoint). No OpenAI anywhere: vector_rag embeds with a LOCAL
# sentence-transformers model (free, deterministic), judging is off.
model: glm-4.6
embedding_model: st:BAAI/bge-small-en-v1.5
judge: false

system_params:
  vectorless_pageindex:
    org: vlbench
    ingest_timeout: 5400
    query_timeout: 240
    max_hops: 6
    page_content_limit: 16000
    server_cache_disabled: true   # you attest the deployed server runs cold
  vector_rag:
    backend: memory               # in-RAM cosine; no Postgres, no API key
    embedding_model: st:BAAI/bge-small-en-v1.5
    chunk_tokens: 512
    overlap_tokens: 64
