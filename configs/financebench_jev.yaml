# FinanceBench head-to-head, 2026-09-19: Vectorless on Jev (judgewalk, minimal
# ingest, PDFs) against chunk-and-embed (Gemini embeddings, in-memory cosine)
# and BM25, on the 21 filings and 40 questions the local corpus holds.
#
#   VECTORLESS_BASE_URL=http://localhost:7654 vlbench run --config configs/financebench_jev.yaml
dataset: financebench
dataset_params:
  docs_dir: data/financebench/docs

systems:
  - vectorless
  - vector_rag        # local BGE-small — the honest chunk-and-embed baseline
  - bm25

k: 5
repeats: 2            # the determinism axis
cold: true
limit: 150
sample_seed: 0
out_dir: runs

model: gemini-2.5-flash          # only prices the full-context / judge calls; judgewalk ignores it
embedding_model: gemini-embedding-2
judge: false

system_params:
  vectorless:
    server_cache_disabled: true
    ingest_timeout: 2400
    query_timeout: 300
  vector_rag:
    backend: memory
    embedding_model: BAAI/bge-small-en-v1.5   # gemini-embedding-2 also works, but the free tier is 100 req/min
    chunk_tokens: 512
    overlap_tokens: 64
