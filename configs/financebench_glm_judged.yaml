# FinanceBench with the LLM-judge ANSWER-CORRECTNESS axis, on GLM.
#
# This is the fair way to score treewalk: it's an answer-first system (it emits
# its own answer), so the judge grades treewalk's NATIVE answer against the gold
# answer rather than re-generating one from retrieved sections. bm25 (a pure
# retriever) is still judged via the generator. Both use GLM, so no OpenAI key
# is needed — set VLE_LLM_ANTHROPIC_API_KEY (+ _BASE_URL ending in /v1).
#
# Small limit keeps ingest concurrency low (reliable) and judge cost modest.
dataset: financebench
dataset_params:
  docs_dir: data/financebench/docs
systems:
  - vectorless_treewalk
  - bm25
k: 5
repeats: 1
cold: true
limit: 6
sample_seed: 0
out_dir: runs
model: glm-4.6

# LLM-judge axis on GLM.
judge: true
judge_model: glm-4.6
gen_model: glm-4.6

system_params:
  vectorless_treewalk:
    org: vlbench
    ingest_timeout: 600
    query_timeout: 240
    max_hops: 6
    page_content_limit: 16000
